# Laptop audit settings.
# Loaded with `source`, so this must be valid Bash.
# Installed root-owned. Only IT should be able to change it.

# --- Resource usage warning level (percent) ---
USAGE_THRESHOLD=80
# --- Mount point whose disk usage is checked ---
DISK_MOUNT="/"

# --- Reports older than this many days are deleted ---
REPORT_KEEP_DAYS=30

# --- Files watched by the integrity check ---
INTEGRITY_FILES=(/etc/passwd /etc/shadow /etc/sudoers /etc/hosts /etc/crontab)

# --- Services that are often unneeded ---
RISKY_SERVICES=(avahi-daemon cups-browsed bluetooth gnome-remote-desktop snapd)

# --- Folders scanned for world-writable files ---
WORLD_WRITABLE_DIRS=(/etc /usr /var)

# --- Folders scanned for hidden executables, and names skipped ---
HIDDEN_EXEC_DIRS=(/tmp /var/tmp /dev/shm /root /home)
HIDDEN_EXEC_PRUNE=(.cache .local .mozilla .config snap)

# --- Locations a running program should not start from (patterns, quoted) ---
SUSPICIOUS_PROCESS_PATHS=('/tmp/*' '/var/tmp/*' '/dev/shm/*' '/home/*/Downloads/*')

# --- Cron entries mentioning these folders are critical ---
SUSPICIOUS_CRON_PATHS=(/tmp/ /var/tmp/ /dev/shm/)
# --- Cron files read by the cron check (patterns, quoted) ---
CRON_FILES=('/etc/crontab' '/etc/cron.d/*' '/var/spool/cron/crontabs/*')

# --- Where the dashboard metrics file is written ---
METRICS_FILE="/var/lib/prometheus/node-exporter/laptop_audit.prom"
